name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eai-copilot-starter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build object types
        run: npm run build:object-types

      - name: Object type generator regression test
        run: npm run test:object-types-generator

      - name: Unit tests
        run: npm run test:unit:ci

      - name: PublicAPI and Copilot contract tests
        run: npm run test:contract

      - name: Validate Microsoft package
        run: npm run m365:validate

      - name: Source-unknown handoff evidence test
        run: npm run test:source-unknown-evidence

      - name: AI workspace handoff guidance test
        run: npm run test:ai-workspace-guidance

      - name: Cross-platform lifecycle test
        run: npm run test:cross-platform-lifecycle

      - name: Issue attachment moderation test
        run: node --test tests/issue-attachment-moderation.test.cjs

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Business journey
        run: npm run test:business-scenarios
